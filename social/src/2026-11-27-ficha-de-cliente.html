<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Instrument+Serif:ital@0;1&family=Quicksand:wght@500;600;700&display=block" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<div style="width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:#0F1830;padding:72px 80px;display:flex;flex-direction:column;gap:40px;font-family:Quicksand,sans-serif;color:#F8F5F0">
  <div style="position:absolute;inset:0;background:url(https://images.pexels.com/photos/14267567/pexels-photo-14267567.jpeg?auto=compress&cs=tinysrgb&w=1600) center/cover no-repeat, #16213E;opacity:0.62"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,48,0.95) 0%,rgba(15,24,48,0.80) 30%,rgba(15,24,48,0.40) 52%,rgba(15,24,48,0.70) 72%,rgba(15,24,48,0.96) 100%)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 90% 70%, rgba(229,83,61,0.26) 0%, rgba(229,83,61,0) 46%)"></div>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between">
    <img src="/brand/nailo/nailo-logo-horizontal-negativo.svg" width="250" height="79" alt="Nailo App">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;background:rgba(15,24,48,0.55);border:1px solid rgba(217,185,138,0.40);color:#D9B98A;font-family:Sora,sans-serif;font-weight:600;font-size:22px">✦ Ficha de cliente</div>
  </div>

  <div style="position:relative;display:flex;flex-direction:column;gap:24px;margin-top:20px">
    <h1 style="margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:86px;line-height:1.02;letter-spacing:-3.2px;color:#F8F5F0">Conhece cada cliente<br><span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:124px;letter-spacing:-1px;background:linear-gradient(100deg,#FFB3A5 0%,#FF8A72 45%,#D9B98A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:12px">de cor.</span></h1>
    <p style="margin:0;max-width:800px;font-size:30px;line-height:1.42;font-weight:500;color:rgba(248,245,240,0.84)">O molde, as notas e a última visita ficam guardados. Sem procurar no WhatsApp.</p>
  </div>

  <div style="flex:1"></div>

  <div style="position:relative;display:flex;flex-direction:column;gap:22px;padding:40px 44px;border-radius:32px;background:rgba(22,33,62,0.86);border:1px solid rgba(248,245,240,0.12);box-shadow:0 30px 60px rgba(0,0,0,0.35)">
    <span style="font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:#F8F5F0">Na ficha de cada cliente</span>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <span style="padding:14px 24px;border-radius:999px;background:rgba(229,83,61,0.16);color:#FFB3A5;font-weight:700;font-size:25px">✦ Visitas</span>
      <span style="padding:14px 24px;border-radius:999px;background:rgba(229,83,61,0.16);color:#FFB3A5;font-weight:700;font-size:25px">✦ Total gasto</span>
      <span style="padding:14px 24px;border-radius:999px;background:rgba(229,83,61,0.16);color:#FFB3A5;font-weight:700;font-size:25px">✦ Última marcação</span>
      <span style="padding:14px 24px;border-radius:999px;background:rgba(229,83,61,0.16);color:#FFB3A5;font-weight:700;font-size:25px">✦ Próxima marcação</span>
      <span style="padding:14px 24px;border-radius:999px;background:rgba(217,185,138,0.16);color:#D9B98A;font-weight:700;font-size:25px">✦ Moldes</span>
      <span style="padding:14px 24px;border-radius:999px;background:rgba(217,185,138,0.16);color:#D9B98A;font-weight:700;font-size:25px">✦ Notas</span>
    </div>
  </div>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:14px;height:88px;padding:0 44px;border-radius:999px;background:#C93F2A;color:#FFFFFF;font-family:Sora,sans-serif;font-weight:700;font-size:30px">Criar o meu site
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></div>
    <span style="font-family:Sora,sans-serif;font-weight:600;font-size:30px;color:#D9B98A">nailoapp.pt</span>
  </div>
</div>
</body></html>
