<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Instrument+Serif:ital@0;1&family=Quicksand:wght@500;600;700&display=block" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<div style="width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFF8F3;padding:72px 80px;display:flex;flex-direction:column;gap:40px;font-family:Quicksand,sans-serif;color:#1F1611">
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between">
    <img src="/brand/nailo/nailo-logo-horizontal.svg" width="250" height="79" alt="Nailo App">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;color:#8A6A3C;background:rgba(217,185,138,0.16);border:1px solid rgba(217,185,138,0.55);font-family:Sora,sans-serif;font-weight:600;font-size:22px">✦ Indique e ganhe</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:24px">
    <h1 style="margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:84px;line-height:1.02;letter-spacing:-3.5px;">Conhece outro studio?<br><span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.5px;font-size:112px;color:#C93F2A">Ganhem os dois.</span></h1>
    <p style="margin:0;max-width:860px;font-size:30px;line-height:1.42;font-weight:500;color:#5E4C42">Cada studio tem um link de indicação só seu.</p>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px">
    <div style="display:flex;align-items:center;gap:30px;padding:36px 40px;border-radius:32px;background:#FFFFFF;border:1px solid rgba(31,22,17,0.08);box-shadow:0 14px 30px rgba(31,22,17,0.06)">
      <span style="flex:none;font-family:'Instrument Serif',serif;font-style:italic;font-size:92px;line-height:1;color:#C93F2A">1</span>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:31px">O studio indicado</span><span style="font-size:25px;font-weight:500;color:#6B5A50">Paga o primeiro mês e o seguinte é grátis.</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:30px;padding:36px 40px;border-radius:32px;background:#0F1830;color:#F8F5F0">
      <span style="flex:none;font-family:'Instrument Serif',serif;font-style:italic;font-size:92px;line-height:1;color:#FF8A72">+1</span>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:31px">O seu studio</span><span style="font-size:25px;font-weight:500;color:rgba(248,245,240,0.74)">Ganha um mês sem pagar por cada indicação.</span></div>
    </div>
  </div>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;font-family:Sora,sans-serif;font-weight:600;font-size:24px;color:#6B5A50">
    <span style="letter-spacing:2px">06 / 07</span>
    <span style="display:flex;align-items:center;gap:10px">Deslize <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </div>
</div>
</body></html>
