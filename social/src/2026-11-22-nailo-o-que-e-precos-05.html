<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Instrument+Serif:ital@0;1&family=Quicksand:wght@500;600;700&display=block" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<div style="width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(circle at 90% 8%, rgba(229,83,61,0.18) 0%, rgba(229,83,61,0) 40%), #0F1830;padding:72px 80px;display:flex;flex-direction:column;gap:40px;font-family:Quicksand,sans-serif;color:#F8F5F0">
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;z-index:2">
    <img src="/brand/nailo/nailo-logo-horizontal-negativo.svg" width="250" height="79" alt="Nailo App">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;color:#D9B98A;background:rgba(248,245,240,0.06);border:1px solid rgba(217,185,138,0.35);font-family:Sora,sans-serif;font-weight:600;font-size:22px">✦ Preço</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:22px">
    <h1 style="margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:84px;line-height:1.02;letter-spacing:-3.5px;">Um preço simples, <span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.5px;font-size:110px;background:linear-gradient(100deg,#FFB3A5 0%,#FF8A72 45%,#D9B98A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:10px">tudo incluído.</span></h1>
    <p style="margin:0;max-width:860px;font-size:29px;line-height:1.42;font-weight:500;color:rgba(248,245,240,0.78)">Escolha pagar ao mês ou ao ano. Cancela quando quiser no painel.</p>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center">
    <div style="display:flex;flex-direction:column;gap:18px;padding:44px 40px;border-radius:32px;background:#16213E;border:1px solid rgba(248,245,240,0.12)">
      <span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#F8F5F0">Mensal</span>
      <div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:88px;letter-spacing:-3px;line-height:1">4,90 €</span></div>
      <span style="font-size:26px;font-weight:600;color:rgba(248,245,240,0.72)">por mês + IVA</span>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;gap:18px;padding:44px 40px;border-radius:32px;background:#FFF8F3;color:#1F1611;box-shadow:0 30px 60px rgba(0,0,0,0.4)">
      <span style="position:absolute;top:-22px;right:28px;padding:10px 20px;border-radius:999px;background:#C93F2A;color:#FFFFFF;font-family:Sora,sans-serif;font-weight:700;font-size:21px">Poupa 11,90 €</span>
      <span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:46px;color:#C93F2A">Anual</span>
      <div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:88px;letter-spacing:-3px;line-height:1">46,90 €</span></div>
      <span style="font-size:26px;font-weight:600;color:#5E4C42">por ano + IVA</span>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:14px">
    <span style="padding:14px 22px;border-radius:999px;background:rgba(248,245,240,0.06);border:1px solid rgba(248,245,240,0.14);font-size:23px;font-weight:600">Site com a sua marca</span>
    <span style="padding:14px 22px;border-radius:999px;background:rgba(248,245,240,0.06);border:1px solid rgba(248,245,240,0.14);font-size:23px;font-weight:600">Marcações e WhatsApp</span>
    <span style="padding:14px 22px;border-radius:999px;background:rgba(248,245,240,0.06);border:1px solid rgba(248,245,240,0.14);font-size:23px;font-weight:600">Fichas de cliente</span>
    <span style="padding:14px 22px;border-radius:999px;background:rgba(248,245,240,0.06);border:1px solid rgba(248,245,240,0.14);font-size:23px;font-weight:600">Portfólio e estatísticas</span>
  </div>

  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;font-family:Sora,sans-serif;font-weight:600;font-size:24px;color:rgba(248,245,240,0.62)">
    <span style="letter-spacing:2px">05 / 07</span>
    <span style="display:flex;align-items:center;gap:10px">Deslize <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </div>
</div>
</body></html>
